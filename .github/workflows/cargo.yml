name: Rust

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: "stable"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - &udev-install
        name: Install Development Packages
        run: sudo apt-get update && sudo apt-get install -y libudev-dev

      - &checkout
        uses: actions/checkout@v7

      - &setup-rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: clippy,rustfmt

      - &cargo-cache
        name: Cache Rust dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-${{ env.RUST_VERSION }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ env.RUST_VERSION }}-cargo-

      - name: Build
        env:
          RUSTFLAGS: "-D warnings"
        run: cargo build --verbose

  format:
    runs-on: ubuntu-latest

    steps:
      - *checkout
      - *setup-rust

      - name: Format
        run: cargo fmt --all --check --verbose

  examples:
    runs-on: ubuntu-latest

    steps:
      - *checkout
      - *setup-rust
      - *setup-rust
      - *cargo-cache

      - name: Build Examples
        env:
          RUSTFLAGS: "-D warnings"
        run: cargo build --examples --verbose

  sbom:
    runs-on: ubuntu-latest

    steps:
      - *checkout

      - &nix-install
        uses: nixbuild/nix-quick-install-action@v35

      - name: Install cyclonedx
        run: nix profile add nixpkgs#rustc nixpkgs#cargo nixpkgs#cargo-cyclonedx nixpkgs#cyclonedx-cli

      # cargo-cyclonedx tops out at spec 1.5; BSI TR-03183-2 requires CycloneDX >= 1.6,
      # so the SBOM is generated at 1.5 and then upgraded via `cyclonedx convert`.
      - name: Generate CycloneDX SBOM
        run: cargo cyclonedx --all --format json --spec-version 1.5 --override-filename sbom

      - name: Upgrade SBOM to spec 1.6 and mark dependency-graph completeness
        run: |
          f=sbom.json
          cyclonedx convert --input-file "$f" --output-file "$f" --output-version v1_6
          jq '.compositions = [{"aggregate": "complete", "dependencies": [.metadata.component."bom-ref"]}]
              | .metadata.component.manufacturer = {"url": ["https://github.com/qitechgmbh/control"]}' \
            "$f" > "$f.tmp" && mv "$f.tmp" "$f"

      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          path: sbom.json
          if-no-files-found: error
          archive: false
