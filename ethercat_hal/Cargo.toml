[package]
name = "ethercat_hal"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.100"
# NOTE (qi-heating): patched fork of qitechgmbh/ethercrab-dc — stray/duplicate frames
# are tolerated instead of killing the TX/RX task (ethercrab#293). Pinned to our branch
# `tolerate-stray-frames` based on upstream rev e84f794.
ethercrab = { git = "https://github.com/zaubererty/ethercrab-dc", rev = "e846e27" }
ethercat_hal_derive = { version = "0.1.0", path = "../ethercat_hal_derive" }
units = { path = "../units" }
bitvec = { version = "1.0.1", features = ["alloc"] }
smol = "2.0.2"
rand = "0.9.2"
# "log"-Feature: tracing-Events (z. B. die AL-Status-Diagnostik bei fehlgeschlagenen
# Transitions) werden zusätzlich über die log-Fassade ausgegeben — sichtbar mit
# env_logger in Beispielen, ohne dass ein tracing-subscriber gesetzt werden muss.
tracing = { version = "0.1.44", features = ["log"] }
tokio = { version = "1.50.0", features = ["rt", "rt-multi-thread", "macros", "time"] }
common = {path = "../common"}
ta = "0.5.0"
triple_buffer = "9.0.0"
core_affinity = "0.8.3"
libc = "0.2.186"
spin_sleep = "1.3.3"
futures = "0.3.32"

[dev-dependencies]
approx = "0.5.1"

[lib]

[features]
default = []
mock = []
legacy_code = []
