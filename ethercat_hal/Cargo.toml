[package]
name = "ethercat_hal"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.100"
# Pinned to the v0.7.1 release tag instead of the moving `main` branch.
# `main` regressed the Linux io_uring TX/RX path (Pdu(InvalidIndex(0)) during
# the SAFE-OP -> OP transition), which crash-looped the NixOS HMI.
ethercrab = { git = "https://github.com/ethercrab-rs/ethercrab", rev = "800f412d5e7c61df1c819c7c597da75a317df463" }
ethercat_hal_derive = { version = "0.1.0", path = "../ethercat_hal_derive" }
units = { path = "../units" }
bitvec = { version = "1.0.1", features = ["alloc"] }
smol = "2.0.2"
rand = "0.9.2"
tracing = "0.1.44"
tokio = { version = "1.50.0", features = ["rt", "rt-multi-thread", "macros", "time"] }
common = {path = "../common"}
ta = "0.5.0"
triple_buffer = "9.0.0"
core_affinity = "0.8.3"
libc = "0.2.186"

[dev-dependencies]
approx = "0.5.1"

[lib]

[features]
default = []
mock = []
legacy_code = []
