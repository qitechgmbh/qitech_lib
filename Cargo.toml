[package]
name = "QiTech-Lib"
version = "0.1.0"
edition = "2024"

[workspace]
# This tells Cargo to look inside the subfolder for another project
members = ["src/ethercat_hal","src/ethercat_hal_derive","src/units"]

[dependencies]
bitvec = "1.0.1"
# This is the "bridge" that allows main.rs to see the subcrate
ethercat_hal = { path = "src/ethercat_hal" }
ethercat_hal_derive = { path = "src/ethercat_hal_derive" }

tokio = "1.49.0"
