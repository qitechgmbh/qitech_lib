[workspace]
members = ["common", "ethercat_hal", "ethercat_hal_derive", "units", "xtrem"]
resolver = "3"

[workspace.package]
edition = "2024"

[workspace.dependencies]
# Internal crates
common = { path = "common" }
ethercat_hal = { path = "ethercat_hal" }
ethercat_hal_derive = { path = "ethercat_hal_derive" }
units = { path = "units" }
xtrem = { path = "xtrem" }

# Shared external crates
anyhow = "1.0.102"
bitvec = "1.0.1"
core_affinity = "0.8.3"
libc = "0.2.186"
tokio = "1.50.0"

[package]
name = "qitech_lib"
version = "0.1.0"
edition.workspace = true

[dependencies]
bitvec.workspace = true
ethercat_hal.workspace = true
ethercat_hal_derive.workspace = true
xtrem.workspace = true
units.workspace = true
common.workspace = true
tokio.workspace = true

[dev-dependencies]
serde = { version = "1.0", features = ["derive"] }
postcard = { version = "1.0", features = ["alloc"] }
core_affinity.workspace = true

[lib]

[features]
# This defines 'mock' at the root level and passes it to 'ethercat_hal'
mock = ["ethercat_hal/mock"]
