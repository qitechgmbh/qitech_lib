[workspace]
resolver = "3"
members = [
    "qitech_lib_common",
    "qitech_lib_ethercat_hal",
    "qitech_lib_ethercat_hal_derive",
    "qitech_lib_units",
    "qitech_lib_xtrem",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "LGPL-3.0-only"

[workspace.dependencies]
# Workspace crates
qitech_lib_common = { path = "qitech_lib_common" }
qitech_lib_ethercat_hal = { path = "qitech_lib_ethercat_hal" }
qitech_lib_ethercat_hal_derive = { path = "qitech_lib_ethercat_hal_derive" }
qitech_lib_units = { path = "qitech_lib_units" }
qitech_lib_xtrem = { path = "qitech_lib_xtrem" }

# External crates
anyhow = "1.0.102"
approx = "0.5.1"
bitvec = "1.0.1"
core_affinity = "0.8.3"
deluxe = "0.5.0"
ethercrab = { git = "https://github.com/qitechgmbh/ethercrab-dc", rev = "e84f794db7f7ebe321a6608c7cd1808ca54a6eb0" }
futures = "0.3.32"
libc = "0.2.186"
postcard = "1.0"
proc-macro2 = "1.0"
quote = "1.0"
rand = "0.9.2"
serde = "1.0"
smol = "2.0.2"
spin_sleep = "1.3.3"
syn = "2.0"
ta = "0.5.0"
tokio = "1.50.0"
tracing = "0.1.44"
triple_buffer = "9.0.0"
uom = { version = "0.37.0", default-features = false }

[package]
name = "qitech_lib"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
bitvec.workspace = true
qitech_lib_common.workspace = true
qitech_lib_ethercat_hal.workspace = true
qitech_lib_units.workspace = true
qitech_lib_xtrem.workspace = true

[dev-dependencies]
serde = { workspace = true, features = ["derive"] }
postcard = { workspace = true, features = ["alloc"] }
core_affinity.workspace = true

[lib]

[features]
# This defines 'mock' at the root level and passes it to 'qitech_lib_ethercat_hal'
mock = ["qitech_lib_ethercat_hal/mock"]
